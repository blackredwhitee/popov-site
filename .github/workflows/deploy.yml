name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Права, нужные для деплоя в Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Один активный деплой; новые пуши отменяют предыдущий незавершённый.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
          # Пометки-черновики и заглушки для заказчика на живой версии скрыты
          NEXT_PUBLIC_HIDE_NOTES: "1"
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Боевая выкладка на хостинг reg.ru (mbpopov.ru) по SFTP.
  # Сработает, когда в репозитории заданы секреты REGRU_SFTP_USER и REGRU_SFTP_PASSWORD.
  deploy-regru:
    runs-on: ubuntu-latest
    env:
      HAS_CREDS: ${{ secrets.REGRU_SFTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CREDS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_CREDS == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build for mbpopov.ru (без под-пути /popov-site/)
        if: env.HAS_CREDS == 'true'
        env:
          NEXT_PUBLIC_HIDE_NOTES: "1"
          NEXT_PUBLIC_SITE_URL: "https://mbpopov.ru"
        run: npm ci && npm run build

      - name: Upload to reg.ru by SFTP
        if: env.HAS_CREDS == 'true'
        env:
          SFTP_USER: ${{ secrets.REGRU_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.REGRU_SFTP_PASSWORD }}
          SFTP_HOST: server111.hosting.reg.ru
          SFTP_DIR: www/mbpopov.ru
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$SFTP_USER","$SFTP_PASSWORD" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; mirror -R --delete --exclude-glob .well-known/ --verbose=1 out $SFTP_DIR; bye"
